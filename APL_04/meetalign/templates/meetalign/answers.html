{% extends "meetalign/base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1><a href="{% url 'inbox' meeting.id %}" class="crumb-link">뒤로 가기</a> <span class="crumb-sep">/</span> 질문에 답변하기</h1>
  </div>
</div>
<div class="card elevated">
  <div class="item-icon" style="margin-bottom:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
  {% for q in questions %}
  <form method="post" class="item" style="display:block;margin-bottom:12px">{% csrf_token %}
    <div class="title">Q. {{ q.text }}</div>
    <input type="hidden" name="question_id" value="{{ q.id }}">
    <div class="row" style="margin-top:8px">
      <input name="answer" value="{{ q.answer }}" placeholder="답변을 입력하세요" style="flex:1">
      <button>답변 저장</button>
    </div>
  </form>
  {% empty %}
    <div class="empty"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v5"/><path d="M4 11h4.5a1 1 0 0 1 .9.55L10.5 14h3l1.1-2.45a1 1 0 0 1 .9-.55H20"/><path d="M4 11v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"/></svg>답할 질문이 없습니다.</div>
  {% endfor %}
  <p class="muted" style="margin-top:16px"><a class="btn secondary" href="{% url 'meeting_detail' meeting.id %}">← 회의로 돌아가기</a> <a class="btn ghost" href="{% url 'summary' meeting.id %}">회의 요약</a></p>
</div>
{% endblock %}
