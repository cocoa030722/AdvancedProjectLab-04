{% extends "meetalign/base.html" %}
{% block container_class %} narrow{% endblock %}
{% block content %}
<div class="page-head"><h1><a href="{% url 'meeting_list' team.id %}" class="crumb-link">뒤로 가기</a> <span class="crumb-sep">/</span> 회의 만들기</h1></div>
<div class="card elevated">
  <div class="item-icon" style="margin-bottom:16px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="title">회의 제목</label>
      <input id="title" name="title" placeholder="예: 로그인 화면 시안 회의"></div>
    <div class="field"><label for="deadline">마감일 (선택)</label>
      <input id="deadline" type="date" name="deadline"></div>
    {% include "meetalign/_participant_picker.html" %}
    <button type="submit" class="block" style="margin-top:6px">회의 만들기</button>
  </form>
</div>
{% endblock %}
