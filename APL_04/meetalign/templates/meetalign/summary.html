{% extends "meetalign/base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1><a href="{% url 'meeting_detail' meeting.id %}" class="crumb-link">뒤로 가기</a> <span class="crumb-sep">/</span> 회의 요약</h1>
  </div>
</div>
<div class="card elevated">
  <div class="item-icon" style="margin-bottom:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></div>
  {% if meeting.record %}
    <div class="record">{{ meeting.record }}</div>
    <div class="row" style="margin-top:12px"><a class="btn secondary" href="{% url 'record_file' meeting.id %}">회의록 다운로드</a></div>
  {% else %}
    <div class="empty">아직 생성된 회의록이 없습니다.</div>
  {% endif %}
  {% if meeting.transcript %}
    <details><summary>녹취 원문 보기</summary><div class="record" style="margin-top:8px">{{ meeting.transcript }}</div></details>
  {% endif %}
</div>
{% endblock %}
