{% extends "meetalign/base.html" %}
{% block note %}<li>Django 기본 인증(자체 로그인)으로 실제 로그인한다.</li>{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:24px auto">
  <div class="page-head"><h1>로그인</h1></div>
  {% if form.errors %}<div class="error">아이디 또는 비밀번호가 올바르지 않습니다.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="id_username">아이디</label>
      <input id="id_username" name="username" value="{{ form.username.value|default:'' }}" autofocus></div>
    <div class="field"><label for="id_password">비밀번호</label>
      <input id="id_password" name="password" type="password"></div>
    <div class="row" style="margin-top:6px"><button type="submit">로그인</button></div>
  </form>
  <p class="muted" style="margin-top:16px">계정이 없나요? <a href="{% url 'signup' %}">회원가입</a></p>
</div>
{% endblock %}
