{% extends "meetalign/base.html" %}
{% block note %}<li>Django 기본 인증(자체 로그인)으로 실제 로그인한다.</li>{% endblock %}
{% block content %}
<h1>로그인</h1>
{% if form.errors %}<p>아이디 또는 비밀번호가 올바르지 않습니다.</p>{% endif %}
<form method="post">{% csrf_token %}
<p>아이디 <input name="username" value="{{ form.username.value|default:'' }}"></p>
<p>비밀번호 <input name="password" type="password"></p>
<button>로그인</button></form>
{% endblock %}
