{% extends "meetalign/base.html" %}
{% block note %}<li>팀은 이름으로 생성/참여한다. 참여는 초대/승인 없이 이름만 알면 가능 (목업).</li>{% endblock %}
{% block content %}
<div class="card" style="max-width:520px">
  <div class="page-head"><div class="crumb"><a href="{% url 'index' %}">홈</a></div><h1>팀 생성 / 참여</h1></div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="team_name">팀 이름</label>
      <input id="team_name" name="name" placeholder="예: 캡스톤 4조"></div>
    <div class="row" style="margin-top:6px">
      <button name="action" value="create">팀 만들기</button>
      <button name="action" value="join" class="secondary">기존 팀 참여</button>
    </div>
  </form>
</div>
{% endblock %}
