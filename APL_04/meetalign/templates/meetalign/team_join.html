{% extends "meetalign/base.html" %}
{% block container_class %} narrow{% endblock %}
{% block content %}
<div class="page-head"><h1><a href="{% url 'index' %}" class="crumb-link">뒤로 가기</a> <span class="crumb-sep">/</span> 팀 생성 / 참여</h1></div>
{% if error %}<div class="error">{{ error }}</div>{% endif %}

<h2 class="section-title">새 팀 만들기</h2>
<div class="card elevated">
  <div class="item-icon" style="margin-bottom:16px">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="8.5" r="2.6" opacity=".55"/><path d="M15.5 13.2c2.9.4 4.9 2.5 4.9 5.8" opacity=".55"/></svg>
  </div>
  <form method="post">{% csrf_token %}
    <div class="field"><label for="team_name">팀 이름</label>
      <input id="team_name" name="name" placeholder="예: 캡스톤 4조"></div>
    <button name="action" value="create">팀 만들기</button>
  </form>
</div>

<h2 class="section-title">초대 코드로 참여</h2>
<div class="card elevated">
  <div class="item-icon" style="margin-bottom:16px">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 9.5 12 14l9-4.5"/></svg>
  </div>
  <form method="post">{% csrf_token %}
    <div class="field"><label for="invite_code">초대 코드</label>
      <input id="invite_code" name="code" placeholder="예: 7F3K9A" maxlength="8" style="text-transform:uppercase"></div>
    <button name="action" value="join" class="secondary">참여하기</button>
  </form>
</div>
{% endblock %}
