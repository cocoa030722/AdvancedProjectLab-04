{% extends "meetalign/base.html" %}
{% block note %}<li>팀은 이름으로 생성/참여한다. 참여는 초대/승인 없이 이름만 알면 가능 (목업).</li>{% endblock %}
{% block content %}
<h1>팀 생성/참여</h1>
{% if error %}<p>{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
<input name="name" placeholder="팀 이름">
<button name="action" value="create">팀 생성</button>
<button name="action" value="join">팀 참여</button>
</form>
{% endblock %}
